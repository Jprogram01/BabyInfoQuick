[project]
name = "babyinfoquick"
version = "0.1.0"
description = "Retrieval-augmented QA over public pediatric and infant-care guidance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2.2",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "anthropic>=0.121.0",
    "openai>=1.55",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
biq = "babyinfoquick.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["babyinfoquick*"]

[tool.ruff]
line-length = 100
target-version = "py311"
