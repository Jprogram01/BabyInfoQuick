name: hybrid_rerank
description: Hybrid retrieval followed by a BGE cross-encoder rerank.
collection: biq_section

embedding:
  model_name: BAAI/bge-base-en-v1.5
  revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a

chunking:
  strategy: section
  target_tokens: 350
  overlap_tokens: 60
  max_tokens: 600
  min_tokens: 40

retrieval:
  dense: true
  lexical: true
  dense_top_k: 30
  lexical_top_k: 30
  fusion: rrf
  rrf_k: 60
  age_filter: pre
  final_top_k: 5
  min_score: 0.0

rerank:
  enabled: true
  model_name: BAAI/bge-reranker-base
  revision: 2cfc18c9415c912f9d8155881c133215df768a70
  top_k: 20
  batch_size: 16
